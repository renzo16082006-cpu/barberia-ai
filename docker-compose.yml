services:
  db:
    image: pgvector/pgvector:pg18-trixie
    container_name: barberia-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}           # CAMBIO
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}   # CAMBIO
      POSTGRES_DB: ${POSTGRES_DB}               # CAMBIO
    ports:
      - "127.0.0.1:5432:5432"                   # CAMBIO
    volumes:
      - barberia_data:/var/lib/postgresql

  adminer:
    image: adminer
    container_name: barberia-adminer
    ports:
      - "127.0.0.1:8080:8080"                   # CAMBIO
    depends_on:
      - db

volumes:
  barberia_data:
